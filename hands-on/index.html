<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova 2 Sonic Playground</title>
  <style>
    :root {
      --bg: #101820;
      --surface: #1a2230;
      --surface-raised: #222e3c;
      --border: #2e3e50;
      --text: #e4eaf0;
      --text-dim: #7e90a4;
      --accent: #ff9900;
      --green: #34d399;
      --red: #f87171;
      --blue: #60a5fa;
      --purple: #a78bfa;
      --radius: 10px;
      --mono: 'SF Mono', 'Cascadia Code', 'JetBrains Mono', Consolas, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans JP', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ─── Top Bar ─── */
    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .topbar h1 { font-size: 0.9rem; font-weight: 600; }
    .topbar-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* ─── Main Layout ─── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ─── Control Strip ─── */
    .control-strip {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .btn-mic {
      width: 48px; height: 48px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .btn-mic.idle { background: var(--green); color: #000; }
    .btn-mic.active { background: var(--red); color: #fff; animation: glow 1.5s infinite; }
    @keyframes glow { 0%,100%{box-shadow:0 0 0 0 rgba(248,113,113,0.4)} 50%{box-shadow:0 0 0 10px rgba(248,113,113,0)} }

    .prompt-preview {
      flex: 1;
      min-width: 0;
      background: var(--surface-raised);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 0.75rem;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .prompt-preview:hover { border-color: var(--accent); color: var(--text); }
    .prompt-preview .label { color: var(--accent); font-weight: 600; margin-right: 6px; }

    .btn-settings {
      padding: 8px 14px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface-raised);
      color: var(--text);
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .btn-settings:hover { border-color: var(--accent); color: var(--accent); }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      color: var(--text-dim);
      flex-shrink: 0;
    }
    .status-pill .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--text-dim);
    }
    .status-pill .dot.on { background: var(--green); animation: pulse 1.4s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

    /* ─── Log Area ─── */
    .log-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
    }
    .log-entry {
      padding: 6px 10px;
      border-radius: 6px;
      margin-bottom: 4px;
      font-size: 0.8rem;
      line-height: 1.6;
      max-width: 85%;
      word-break: break-word;
    }
    .log-user { background: rgba(96,165,250,0.12); color: var(--blue); margin-left: auto; text-align: right; }
    .log-assistant { background: rgba(52,211,153,0.12); color: var(--green); }
    .log-system { background: rgba(255,153,0,0.08); color: var(--accent); font-size: 0.72rem; max-width: 100%; }
    .log-tool { background: rgba(167,139,250,0.12); color: var(--purple); font-size: 0.72rem; }

    /* ─── Text Input Bar ─── */
    .input-bar {
      display: flex;
      gap: 8px;
      padding: 10px 20px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .input-bar input {
      flex: 1;
      background: var(--surface-raised);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 10px 14px;
      font-size: 0.8rem;
      outline: none;
    }
    .input-bar input:focus { border-color: var(--accent); }
    .input-bar input::placeholder { color: var(--text-dim); }
    .input-bar input:disabled { opacity: 0.4; }
    .input-bar button {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      background: var(--accent);
      color: #000;
      font-weight: 600;
      font-size: 0.78rem;
      cursor: pointer;
    }
    .input-bar button:disabled { opacity: 0.3; cursor: not-allowed; }

    /* ─── Settings Panel (Slide-over) ─── */
    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; }
    .overlay.open { display: block; }
    .settings-panel {
      position: fixed;
      top: 0; right: -460px;
      width: 440px; max-width: 90vw;
      height: 100%;
      background: var(--surface);
      border-left: 1px solid var(--border);
      z-index: 101;
      display: flex;
      flex-direction: column;
      transition: right 0.25s ease;
    }
    .settings-panel.open { right: 0; }
    .settings-header {
      display: flex;
      align-items: center;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
    }
    .settings-header h2 { font-size: 0.9rem; font-weight: 600; }
    .settings-header .close-btn {
      margin-left: auto;
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 1.3rem;
      cursor: pointer;
      padding: 4px 8px;
    }
    .settings-header .close-btn:hover { color: var(--text); }
    .settings-body {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
    }
    .field { margin-bottom: 18px; }
    .field-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .field-label span {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--text-dim);
    }
    .field-label button {
      font-size: 0.65rem;
      padding: 2px 8px;
      border-radius: 3px;
      border: 1px solid var(--border);
      background: var(--surface-raised);
      color: var(--text-dim);
      cursor: pointer;
    }
    .field-label button:hover { color: var(--accent); border-color: var(--accent); }
    textarea.cfg {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 0.73rem;
      line-height: 1.6;
      padding: 12px;
      resize: vertical;
      outline: none;
    }
    textarea.cfg:focus { border-color: var(--accent); }
    textarea.cfg.prompt { font-family: inherit; font-size: 0.8rem; min-height: 120px; }
    textarea.cfg.json { min-height: 140px; }
    .field-note {
      margin-top: 4px;
      font-size: 0.67rem;
      color: var(--text-dim);
      line-height: 1.4;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: var(--text);
    }
    .toggle-row input { width: 16px; height: 16px; accent-color: var(--accent); }

    /* ─── Responsive ─── */
    @media (max-width: 600px) {
      .control-strip { flex-wrap: wrap; }
      .prompt-preview { order: 10; flex-basis: 100%; }
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="topbar">
    <h1>Nova 2 Sonic Playground</h1>
    <div class="topbar-right"></div>
  </div>

  <!-- Main -->
  <div class="main">
    <!-- Control Strip -->
    <div class="control-strip">
      <button class="btn-mic idle" id="btn-mic" title="Start / Stop">&#x25B6;</button>
      <div class="status-pill">
        <div class="dot" id="status-dot"></div>
        <span id="status-text">Ready</span>
      </div>
      <div class="prompt-preview" id="prompt-preview" onclick="openSettings()" title="クリックして設定を開く">
        <span class="label">Prompt:</span><span id="prompt-preview-text"></span>
      </div>
      <button class="btn-settings" onclick="openSettings()">Settings</button>
    </div>

    <!-- Log -->
    <div class="log-area" id="log"></div>

    <!-- Text Input -->
    <div class="input-bar">
      <input type="text" id="text-input" placeholder="テキスト入力 (Enter送信) — Model-start-first等に使用" disabled>
      <button id="btn-send" disabled onclick="sendText()">Send</button>
    </div>
  </div>

  <!-- Settings Panel -->
  <div class="overlay" id="overlay" onclick="closeSettings()"></div>
  <div class="settings-panel" id="settings-panel">
    <div class="settings-header">
      <h2>Session Settings</h2>
      <button class="close-btn" onclick="closeSettings()">&times;</button>
    </div>
    <div class="settings-body">

      <!-- System Prompt -->
      <div class="field">
        <div class="field-label">
          <span>System Prompt</span>
          <button onclick="resetSystemPrompt()">Reset</button>
        </div>
        <textarea class="cfg prompt" id="system-prompt" spellcheck="false"></textarea>
      </div>

      <!-- Tool use -->
      <div class="field">
        <div class="toggle-row">
          <input type="checkbox" id="chk-tools">
          <label for="chk-tools">Tool use を有効にする (天気取得)</label>
        </div>
      </div>

      <!-- Advanced: Session Config -->
      <div class="field">
        <div class="field-label">
          <span>Session Config</span>
          <button onclick="resetSessionConfig()">Reset</button>
        </div>
        <textarea class="cfg json" id="session-config" spellcheck="false"></textarea>
        <p class="field-note">inferenceConfiguration / turnDetectionConfiguration (endpointingSensitivity: LOW, MEDIUM, HIGH)</p>
      </div>

      <!-- Advanced: Prompt Config -->
      <div class="field">
        <div class="field-label">
          <span>Prompt Config</span>
          <button onclick="resetPromptConfig()">Reset</button>
        </div>
        <textarea class="cfg json" id="prompt-config" spellcheck="false"></textarea>
        <p class="field-note">audioOutputConfiguration: voiceId, sampleRateHertz (8000/16000/24000)</p>
      </div>

    </div>
  </div>

  <script>
  // ─── Defaults ───────────────────────────────────
  const DEFAULTS = {
    systemPrompt: "You are a friendly English conversation partner. Keep responses short (1-2 sentences). Respond in the same language as the user.",
    sessionConfig: {
      inferenceConfiguration: { maxTokens: 1024, topP: 0.9, temperature: 0.7 },
      turnDetectionConfiguration: { endpointingSensitivity: "MEDIUM" }
    },
    promptConfig: {
      audioOutputConfiguration: {
        mediaType: "audio/lpcm",
        sampleRateHertz: 24000,
        sampleSizeBits: 16,
        channelCount: 1,
        voiceId: "matthew",
        encoding: "base64",
        audioType: "SPEECH"
      },
      textOutputConfiguration: { mediaType: "text/plain" }
    }
  };

  // ─── Elements ───────────────────────────────────
  const $ = id => document.getElementById(id);
  const btnMic = $('btn-mic');
  const statusDot = $('status-dot');
  const statusText = $('status-text');
  const logEl = $('log');
  const textInput = $('text-input');
  const btnSend = $('btn-send');
  const systemPromptEl = $('system-prompt');
  const sessionConfigEl = $('session-config');
  const promptConfigEl = $('prompt-config');
  const chkTools = $('chk-tools');
  const overlay = $('overlay');
  const settingsPanel = $('settings-panel');
  const promptPreviewText = $('prompt-preview-text');

  // ─── State ──────────────────────────────────────
  let ws = null, audioCtx = null, mediaStream = null, processor = null;
  let playCtx = null, nextPlayTime = 0, isStreaming = false;

  // ─── Init ───────────────────────────────────────
  resetSystemPrompt();
  resetSessionConfig();
  resetPromptConfig();
  updatePromptPreview();

  systemPromptEl.addEventListener('input', updatePromptPreview);

  btnMic.addEventListener('click', () => isStreaming ? stop() : start());
  textInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); sendText(); } });

  // ─── Settings Panel ─────────────────────────────
  function openSettings() { overlay.classList.add('open'); settingsPanel.classList.add('open'); }
  function closeSettings() { overlay.classList.remove('open'); settingsPanel.classList.remove('open'); updatePromptPreview(); }

  // ─── Reset Functions ────────────────────────────
  function resetSystemPrompt() { systemPromptEl.value = DEFAULTS.systemPrompt; updatePromptPreview(); }
  function resetSessionConfig() { sessionConfigEl.value = JSON.stringify(DEFAULTS.sessionConfig, null, 2); }
  function resetPromptConfig() {
    promptConfigEl.value = JSON.stringify(DEFAULTS.promptConfig, null, 2);
  }

  // ─── UI Updates ─────────────────────────────────
  function updatePromptPreview() {
    const text = systemPromptEl.value.replace(/\n/g, ' ');
    promptPreviewText.textContent = text || '(empty)';
  }

  // ─── Session ────────────────────────────────────
  async function start() {
    // Parse configs
    let sessionConfig, promptConfig;
    try { sessionConfig = JSON.parse(sessionConfigEl.value); } catch(e) { addLog('system','Session Config JSON error'); openSettings(); return; }
    try { promptConfig = JSON.parse(promptConfigEl.value); } catch(e) { addLog('system','Prompt Config JSON error'); openSettings(); return; }

    try {
      mediaStream = await navigator.mediaDevices.getUserMedia({ audio: { sampleRate:16000, channelCount:1, echoCancellation:true, noiseSuppression:true } });
      audioCtx = new AudioContext({ sampleRate: 16000 });
      const src = audioCtx.createMediaStreamSource(mediaStream);
      processor = audioCtx.createScriptProcessor(2048, 1, 1);
      src.connect(processor);
      processor.connect(audioCtx.destination);

      ws = new WebSocket('ws://127.0.0.1:8765');
      ws.onopen = () => {
        ws.send(JSON.stringify({ type: 'start', config: { sessionConfig, promptConfig, systemPrompt: systemPromptEl.value, enableTools: chkTools.checked } }));
        isStreaming = true;
        setUI('active');
        addLog('system', 'Started');

        processor.onaudioprocess = e => {
          if (!isStreaming || !ws || ws.readyState !== 1) return;
          const f = e.inputBuffer.getChannelData(0);
          const i16 = new Int16Array(f.length);
          for (let i=0;i<f.length;i++) { const s=Math.max(-1,Math.min(1,f[i])); i16[i]=s<0?s*0x8000:s*0x7FFF; }
          ws.send(JSON.stringify({ type:'audio', data: bufToB64(i16.buffer) }));
        };
      };
      ws.onmessage = e => handleMsg(JSON.parse(e.data));
      ws.onclose = () => { if(isStreaming) stop(); };
      ws.onerror = () => { addLog('system','Connection error — server.py is running?'); stop(); };
    } catch(err) { addLog('system', 'Error: ' + err.message); }
  }

  function stop() {
    if (ws && ws.readyState === 1) { ws.send(JSON.stringify({type:'stop'})); ws.close(); }
    ws = null; isStreaming = false;
    if (processor) { processor.disconnect(); processor = null; }
    if (audioCtx) { audioCtx.close(); audioCtx = null; }
    if (mediaStream) { mediaStream.getTracks().forEach(t=>t.stop()); mediaStream = null; }
    clearAudioQueue();
    setUI('idle');
    addLog('system', 'Stopped');
  }

  function sendText() {
    const t = textInput.value.trim();
    if (!t || !isStreaming || !ws) return;
    ws.send(JSON.stringify({ type:'textInject', content: t }));
    addLog('user', t);
    textInput.value = '';
  }

  function setUI(state) {
    if (state === 'active') {
      btnMic.className = 'btn-mic active';
      btnMic.innerHTML = '&#x25A0;';
      statusDot.classList.add('on');
      statusText.textContent = 'Streaming';
      textInput.disabled = false;
      btnSend.disabled = false;
    } else {
      btnMic.className = 'btn-mic idle';
      btnMic.innerHTML = '&#x25B6;';
      statusDot.classList.remove('on');
      statusText.textContent = 'Ready';
      textInput.disabled = true;
      btnSend.disabled = true;
    }
  }

  // ─── Message Handler ────────────────────────────
  function handleMsg(msg) {
    switch(msg.type) {
      case 'transcript': addLog(msg.role==='USER'?'user':'assistant', msg.content); break;
      case 'audio': playAudio(msg.data); break;
      case 'clearAudio': clearAudioQueue(); break;
      case 'toolCall': addLog('tool', `Tool: ${msg.toolName}(${msg.params})`); break;
      case 'state': if(msg.state==='ended') addLog('system','Session ended (timeout or error)'); break;
      case 'error': addLog('system', msg.message); break;
    }
  }

  // ─── Audio Playback ─────────────────────────────
  let scheduledSources = [];

  function playAudio(b64) {
    if (!playCtx) { playCtx = new AudioContext({sampleRate:24000}); nextPlayTime = playCtx.currentTime; }
    const i16 = new Int16Array(b64ToArr(b64));
    const f32 = new Float32Array(i16.length);
    for (let i=0;i<i16.length;i++) f32[i] = i16[i]/32768.0;
    const buf = playCtx.createBuffer(1, f32.length, 24000);
    buf.getChannelData(0).set(f32);
    const s = playCtx.createBufferSource();
    s.buffer = buf; s.connect(playCtx.destination);
    const now = playCtx.currentTime;
    if (nextPlayTime < now) nextPlayTime = now;
    s.start(nextPlayTime);
    nextPlayTime += buf.duration;
    // 参照を保持して barge-in 時に停止可能にする
    scheduledSources.push(s);
    s.onended = () => { scheduledSources = scheduledSources.filter(x => x !== s); };
  }

  function clearAudioQueue() {
    // barge-in: スケジュール済み音声を即座に停止
    for (const s of scheduledSources) {
      try { s.stop(); } catch(e) {}
    }
    scheduledSources = [];
    if (playCtx) nextPlayTime = playCtx.currentTime;
  }

  // ─── Log ────────────────────────────────────────
  function addLog(type, text) {
    const d = document.createElement('div');
    d.className = `log-entry log-${type}`;
    d.textContent = text;
    logEl.appendChild(d);
    logEl.scrollTop = logEl.scrollHeight;
  }

  // ─── Utils ──────────────────────────────────────
  function bufToB64(buf) { const b=new Uint8Array(buf); let s=''; for(let i=0;i<b.length;i++) s+=String.fromCharCode(b[i]); return btoa(s); }
  function b64ToArr(b64) { const s=atob(b64); const b=new Uint8Array(s.length); for(let i=0;i<s.length;i++) b[i]=s.charCodeAt(i); return b.buffer; }
  </script>
</body>
</html>
